services:

  neo4j:
    image: neo4j
    environment:
      - NEO4J_AUTH=none
      - NEO4J_server_memory_heap_max__size=6G
      - NEO4J_db_import_csv_legacy__quote__escaping=false
      - NEO4J_dbms_security_procedures_unrestricted=gds.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*
      - NEO4J_PLUGINS=["graph-data-science"]
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: "wget -qq http://localhost:7474"
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  notebook:
    image: "quay.io/jupyter/scipy-notebook:latest"
    ports:
      - "8888:8888"
    volumes:
      - .:/home/jovyan/work/bd2
    user: root
    environment:
      - JUPYTER_TOKEN=bd2
      - GRANT_SUDO=yes
      - DB_HOSTNAME=neo4j
    depends_on:
      neo4j:
        condition: service_healthy
