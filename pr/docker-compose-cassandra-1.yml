# Versión con un sólo contenedor de Cassandra.

networks:
  cassandra-net:
    driver: bridge

services:
  cassandra1:
    image: "cassandra:latest"
    container_name: "cassandra1"
    ports:
      - 7000
      - 9042
    networks:
      - cassandra-net
    volumes:
      - /tmp/cassandra:/tmp/cassandra
    environment:
      - CASSANDRA_START_RPC=true # default
      - CASSANDRA_RPC_ADDRESS=0.0.0.0 # default
      - CASSANDRA_LISTEN_ADDRESS=auto # default, use IP addr of container # = CASSANDRA_BROADCAST_ADDRESS
      - CASSANDRA_CLUSTER_NAME=my-cluster
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_DC=my-datacenter-1
    restart: on-failure
    command: bash -c 'sed -i -e "s/\(batch_size_warn_threshold:\).*/\\1 128KiB/;s/\(batch_size_fail_threshold:\).*/\\1 1024KiB/;s/\(materialized_views_enabled:\).*/\\1 true/" /etc/cassandra/cassandra.yaml && /usr/local/bin/docker-entrypoint.sh cassandra -f'
    healthcheck:
      test: ["CMD-SHELL", "nodetool status"]
      interval: 2m
      start_period: 2m
      timeout: 10s
      retries: 3

  notebook:
    image: "quay.io/jupyter/scipy-notebook:latest"
    ports:
      - "8888:8888"
    volumes:
      - .:/home/jovyan/work/bd2
      - /tmp/cassandra:/tmp/cassandra
    user: root
    environment:
      - JUPYTER_TOKEN=bd2
      - GRANT_SUDO=yes
      - DB_HOSTNAME=cassandra1
      - RUNNING_IN_CONTAINER=true
    networks:
      - cassandra-net
    depends_on:
      cassandra1:
        condition: service_healthy
